name: Publish approved Dream Team version
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full reviewed commit SHA, after owner approval
        required: true
        type: string
      confirmation:
        description: After final owner approval, enter DREAMTEAM-LIVE
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dreamteam-production
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirmation == 'DREAMTEAM-LIVE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tools/check-site.cjs
      - uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DREAMTEAMBARBERSHOP_99CA0 }}'
          channelId: live
          projectId: dreamteambarbershop-99ca0
